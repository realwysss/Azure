plugins {
	id 'java'
}

version = '1.0.2'

base {
	archivesName = 'azure-loader'
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly files(System.getProperty('user.home') + '/.gradle/caches/modules-2/files-2.1/net.fabricmc/fabric-loader/0.19.5/ff9e65cffca4a67f31523e1807fe0855940fcbfa/fabric-loader-0.19.5.jar')
	compileOnly 'com.google.code.gson:gson:2.11.0'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

jar {
	from('LICENSE')
}
