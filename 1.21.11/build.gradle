plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/' }
}

base {
	archivesName = "azure-${project.archive_tag}"
}

loom {
	mods {
		"azure" {
			sourceSet sourceSets.main
		}
	}
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(remapJar.archiveFile)
	mods.from(file(System.getProperty("user.home") + "/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/0.141.6+1.21.11/c98467cbbaf4d197377266795ae015f4130d65b6/fabric-api-0.141.6+1.21.11.jar"))
	runDir = file("build/prodrun")
}
